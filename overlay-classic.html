<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>International Broadcast Overlay</title>
  <style>
    /* Import professional broadcast font */
    @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      font-family: 'Roboto Condensed', sans-serif;
      overflow: hidden;
      color: white;
    }

    /* Main Centered Scoreboard */
    .scoreboard-wrapper {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Team Name Block */
    .team-section {
      background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 100%);
      padding: 12px 30px;
      display: flex;
      align-items: center;
      min-width: 250px;
      border-right: 3px solid #FFD700; /* Thunders Gold */
    }
    .team-name {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* Runs & Wickets Block */
    .score-section {
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
      padding: 12px 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 140px;
    }
    .score-text {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }

    /* Overs Block */
    .overs-section {
      background: #f5f5f5;
      color: #111;
      padding: 12px 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 700;
    }

    /* Premium Sponsor Slide-In */
    .sponsor-popup {
      position: absolute;
      top: 50px;
      right: -400px;
      width: 280px;
      background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
      border-left: 4px solid #FFD700; /* Thunders Gold */
      padding: 20px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      transition: right 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .sponsor-popup.active {
      right: 50px;
    }
    .sponsor-title {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }
    .sponsor-sub {
      font-size: 14px;
      color: #e0e0e0;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- TV Style Lower Third -->
  <div class="scoreboard-wrapper">
    <div class="team-section">
      <span class="team-name" id="team">MELBOURNE THUNDERS</span>
    </div>
    <div class="score-section">
      <span class="score-text"><span id="runs">0</span>/<span id="wickets">0</span></span>
    </div>
    <div class="overs-section">
      <span id="overs">0.0</span> OVS
    </div>
  </div>

  <!-- BatBuddy Sports Graphic -->
  <div class="sponsor-popup" id="sponsor-banner">
    <div class="sponsor-title">SIX!</div>
    <div class="sponsor-sub">Brought to you by<br><b>BatBuddy Sports</b></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

    // Standard Connection to your active database
    const firebaseConfig = {
      databaseURL: "https://thunders-scoreboard-ab3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const matchRef = ref(db, 'match_data');

    // Live Data Listener
    onValue(matchRef, (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('team').innerText = data.batting_team || "MELBOURNE THUNDERS";
        document.getElementById('runs').innerText = data.runs || 0;
        document.getElementById('wickets').innerText = data.wickets || 0;
        document.getElementById('overs').innerText = (data.overs || 0).toFixed(1);
        
        const sponsorBanner = document.getElementById('sponsor-banner');
        if (data.sponsor_active) {
          sponsorBanner.classList.add('active');
        } else {
          sponsorBanner.classList.remove('active');
        }
      }
    });
  </script>
</body>
</html>
