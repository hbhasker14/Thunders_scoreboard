<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorer Controller</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
    h1 { color: #333; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: 0 auto; }
    button { padding: 20px; font-size: 20px; font-weight: bold; border: none; border-radius: 10px; color: white; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-run { background-color: #4CAF50; }
    .btn-wicket { background-color: #f44336; }
    .btn-sponsor { background-color: #2196F3; grid-column: span 2; padding: 30px; font-size: 24px; margin-top: 15px; }
    button:active { transform: scale(0.98); }
    #status { margin-top: 20px; font-weight: bold; color: #555; }
  </style>
</head>
<body>

  <h1>Match Controller</h1>
  <div id="status">Connecting to Firebase...</div>
  <br>

  <div class="grid">
    <button class="btn-run" onclick="addRuns(1)">+1 Run</button>
    <button class="btn-run" onclick="addRuns(4)">+4 Runs</button>
    <button class="btn-run" onclick="addRuns(6)">+6 Runs</button>
    <button class="btn-wicket" onclick="addWicket()">Wicket</button>
  </div>

  <button class="btn-sponsor" onclick="toggleSponsor()">Toggle BatBuddy Popup</button>

  <!-- Firebase Modular SDK via CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
    import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://thunders-scoreboard-ab3f5-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const matchRef = ref(db, 'match_data');

    let currentRuns = 0;
    let currentWickets = 0;
    let sponsorActive = false;

    // Load initial data
    get(matchRef).then((snapshot) => {
      if (snapshot.exists()) {
        const data = snapshot.val();
        currentRuns = data.runs || 0;
        currentWickets = data.wickets || 0;
        sponsorActive = data.sponsor_active || false;
        document.getElementById('status').innerText = "Connected! Ready to score.";
      } else {
        // Create the structure if it doesn't exist yet
        set(matchRef, {
          batting_team: "Melbourne Thunders",
          runs: 0,
          wickets: 0,
          overs: 0.0,
          sponsor_active: false,
          sponsor_name: "BatBuddy Sports"
        });
        document.getElementById('status').innerText = "Database initialized. Ready to score.";
      }
    }).catch((error) => {
      document.getElementById('status').innerText = "Connection Error. Check Project ID.";
    });

    // Score update functions 
    window.addRuns = function(runs) {
      currentRuns += runs;
      update(matchRef, { runs: currentRuns });
      document.getElementById('status').innerText = `Added ${runs} run(s). Total: ${currentRuns}`;
    };

    window.addWicket = function() {
      currentWickets += 1;
      update(matchRef, { wickets: currentWickets });
      document.getElementById('status').innerText = `Wicket! Total: ${currentWickets}`;
    };

    window.toggleSponsor = function() {
      sponsorActive = !sponsorActive;
      update(matchRef, { sponsor_active: sponsorActive });
      
      const btn = document.querySelector('.btn-sponsor');
      if (sponsorActive) {
        btn.style.backgroundColor = "#FF9800";
        btn.innerText = "Hide BatBuddy Popup";
      } else {
        btn.style.backgroundColor = "#2196F3";
        btn.innerText = "Toggle BatBuddy Popup";
      }
    };
  </script>
</body>
</html>
